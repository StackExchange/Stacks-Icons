<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>[Beta] Stacks-Icons manifest</title>

        <link
            rel="stylesheet"
            href="https://unpkg.com/@stackoverflow/stacks/dist/css/stacks.min.css"
        />
        {CSS_STYLES}
        <style>
            .svg-icon:not(.native) *,
            .svg-spot:not(.native) * {
                fill: unset;
            }
        </style>
    </head>

    <body>
        <div class="mx-auto pb64 sm:pb16 px32 sm:px16 pt32 sm:pt16">
            <h2 class="fs-headline1 bb bc-black-300 pb8 mb64 sm:mb32">
                Icons
                <span class="s-badge s-badge__new lh-lg">Beta</span>
            </h2>
            <div class="d-grid grid__5 md:grid__3 sm:grid__2 gx32 gy64 sm:gx16 sm:gy32 mt32 sm:mt16">{ICONS_MANIFEST}</div>
            <h2 class="fs-headline1 my64 sm:my32 bb bc-black-300 pb8">
                Spots
                <span class="s-badge s-badge__new lh-lg">Beta</span>
            </h2>
            <div class="d-grid grid__5 md:grid__3 sm:grid__2 gx32 gy64 sm:gx16 sm:gy32 mt32 sm:mt16">{SPOTS_MANIFEST}</div>
            <h2 class="fs-headline1 my64 sm:my32 bb bc-black-300 pb8">
                CSS Icons
                <span class="s-badge s-badge__new lh-lg">Beta</span>
            </h2>
            <div class="d-grid grid__6 md:grid__3 sm:grid__2 gx32 gy64 sm:gx16 sm:gy32 ta-center fc-light mt32 sm:mt16">
                {CSS_MANIFEST}
            </div>
        </div>
    </body>
</html>
