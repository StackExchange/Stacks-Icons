<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>[Beta] Stacks-Icons manifest</title>

        <link
            rel="stylesheet"
            href="https://unpkg.com/@stackoverflow/stacks/dist/css/stacks.min.css"
        />
        {CSS_STYLES}
    </head>

    <body>
        <div class="mx-auto pb64 sm:pb16 px32 sm:px16 pt32 sm:pt16">

            <h2 class="fs-headline1 bb bc-black-300 pb8 mb32 sm:mb16">
                Icons
                <span class="s-badge s-badge__new lh-lg">Beta</span>
            </h2>
             <!-- Size Control -->
             <div class="mb32 p16 s-card d-flex ai-center wmx4">
                <label for="sizeSlider" class="d-flex ai-center fw-bold">Size Classes:</label>
                <div class="d-flex fd-column w100 ml16">
                    <input
                        type="range"
                        id="sizeSlider"
                        min="0"
                        max="3"
                        value="1"
                        step="1"
                        class="w100"
                    />
                    <div class="d-flex jc-space-between fc-light mt4">
                        <div>s20</div>
                        <div>s24</div>
                        <div>s32</div>
                        <div>s64</div>
                    </div>
                </div>
            </div>
            <div
                class="d-grid grid__5 md:grid__3 sm:grid__2 gx32 gy64 sm:gx16 sm:gy32 mt32 sm:mt16"
            >
                {ICONS_MANIFEST}
            </div>
            <h2 class="fs-headline1 my64 sm:my32 bb bc-black-300 pb8">
                Spots
                <span class="s-badge s-badge__new lh-lg">Beta</span>
            </h2>
            <div
                class="d-grid grid__5 md:grid__3 sm:grid__2 gx32 gy64 sm:gx16 sm:gy32 mt32 sm:mt16"
            >
                {SPOTS_MANIFEST}
            </div>
            <h2 class="fs-headline1 my64 sm:my32 bb bc-black-300 pb8">
                CSS Icons
                <span class="s-badge s-badge__new lh-lg">Beta</span>
            </h2>
            <div
                class="d-grid grid__6 md:grid__3 sm:grid__2 gx32 gy64 sm:gx16 sm:gy32 ta-center fc-light mt32 sm:mt16"
            >
                {CSS_MANIFEST}
            </div>
        </div>

        <script>
            (function() {
                const sizes = [20, 24, 32, 64];
                const slider = document.getElementById('sizeSlider');
                
                function updateIconSizes(sizeIndex) {
                    const size = sizes[sizeIndex];
                    const sizeClass = 's' + size;
                    
                    // Update all elements with svg-icon class
                    const icons = document.querySelectorAll('.svg-icon');
                    
                    icons.forEach(icon => {
                        // Remove all size classes
                        sizes.forEach(s => {
                            icon.classList.remove('s' + s);
                        });
                        
                        // Add the new size class
                        icon.classList.add(sizeClass);
                    });
                }
                
                // Set initial size (24px is default, index 1)
                updateIconSizes(1);
                
                // Listen for slider changes
                slider.addEventListener('input', function() {
                    updateIconSizes(parseInt(this.value));
                });
            })();
        </script>
    </body>
</html>
